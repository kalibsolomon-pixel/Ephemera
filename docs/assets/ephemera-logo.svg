<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#11182B"/>
      <stop offset="100%" stop-color="#191632"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#6FB7FF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6FB7FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="eTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="eMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="eBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FB7FF"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="eSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#6FB7FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark-glass squircle container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="5"/>

  <!-- Subtle diagonal glass highlight -->
  <path d="M 128 24 L 384 24 C 441 24 488 71 488 128 L 488 156 C 365 215 190 245 24 256 L 24 128 C 24 71 71 24 128 24 Z"
        fill="#FFFFFF" fill-opacity="0.03"/>

  <!-- Stylized geometric "E" mark -->
  <g filter="url(#softGlow)">
    <!-- Vertical spine with dynamic chamfered ends -->
    <polygon points="154,116 206,116 206,396 154,396 138,380 138,132" fill="url(#eSpine)"/>

    <!-- Top prism wing -->
    <polygon points="154,116 374,116 348,168 154,168" fill="url(#eTop)"/>

    <!-- Middle kinetic prism bar (detached with sleek notch) -->
    <polygon points="222,231 352,231 328,281 222,281" fill="url(#eMid)"/>

    <!-- Bottom prism wing -->
    <polygon points="154,344 374,344 348,396 154,396" fill="url(#eBot)"/>
  </g>
</svg>
