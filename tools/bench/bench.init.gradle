// Opt-in competitor-agnostic benchmark probe injected only during benchmark runs.
gradle.projectsEvaluated {
	def p = gradle.rootProject
	def benchOut = p.findProperty('ephemera.benchOut') ?: p.file('build/bench/out').absolutePath
	def benchLabel = p.findProperty('ephemera.benchLabel') ?: 'ephemera'
	def benchBackend = p.findProperty('ephemera.benchBackend') ?: 'OPENGL'
	def benchWorld = p.findProperty('ephemera.benchWorld') ?: 'New World'
	def benchDisableEphemera = (p.findProperty('ephemera.benchDisableEphemera') ?: 'false').toString().toBoolean()
	def benchJfr = (p.findProperty('ephemera.benchJfr') ?: 'true').toString().toBoolean()
	def benchSpark = (p.findProperty('ephemera.benchSpark') ?: 'false').toString().toBoolean()
	def benchDurationSec = (p.findProperty('ephemera.benchDurationSec') ?: '6').toString()
	def benchRd = (p.findProperty('ephemera.benchRd') ?: '20').toString()
	def benchSuite = (p.findProperty('ephemera.benchSuite') ?: 'default').toString()
	def benchRunId = (p.findProperty('ephemera.benchRunId') ?: '').toString().trim()
	def benchFpsCap = (p.findProperty('ephemera.benchFpsCap') ?: '0').toString()
	def benchVsync = (p.findProperty('ephemera.benchVsync') ?: 'false').toString()
	def benchBorderless = (p.findProperty('ephemera.benchBorderless') ?: 'false').toString()

	def probe = p.sourceSets.create('benchprobe') {
		java.srcDir p.file('tools/bench/probe/java')
		resources.srcDir p.file('tools/bench/probe/resources')
		compileClasspath = p.sourceSets.client.compileClasspath
		runtimeClasspath = output + compileClasspath
	}
	p.tasks.named('compileBenchprobeJava') {
		options.release = 25
		options.encoding = 'UTF-8'
	}
	def probeJar = p.tasks.register('benchProbeJar', Jar) {
		from probe.output
		archiveFileName = 'ephemera-bench-probe.jar'
		destinationDirectory = p.file('build/bench/probe-jar')
	}

	def run = p.tasks.named('runClient').get()
	run.dependsOn probeJar
	run.classpath += p.files(probeJar)
	run.maxHeapSize = '4096m'
	run.jvmArgs(
		"-Dephemera.bench.out=${benchOut}",
		"-Dephemera.bench.label=${benchLabel}",
		"-Dephemera.bench.backend=${benchBackend}",
		"-Dephemera.bench.jfr=${benchJfr}",
		"-Dephemera.bench.spark=${benchSpark}",
		"-Dephemera.bench.durationSec=${benchDurationSec}",
		"-Dephemera.bench.rd=${benchRd}",
		"-Dephemera.bench.suite=${benchSuite}",
		"-Dephemera.bench.fpsCap=${benchFpsCap}",
		"-Dephemera.bench.vsync=${benchVsync}",
		"-Dephemera.bench.borderless=${benchBorderless}"
	)
	if (benchRunId) {
		run.jvmArgs "-Dephemera.bench.runId=${benchRunId}"
	}
	if (benchDisableEphemera) {
		run.jvmArgs '-Dfabric.debug.disableModIds=ephemera'
	}
	def extraJvm = p.findProperty('ephemera.extraJvmArgs')
	if (extraJvm) {
		extraJvm.toString().split(/\s+/).findAll { it }.each { run.jvmArgs it }
	}
	run.args '--quickPlaySingleplayer', benchWorld, '--graphicsBackend', benchBackend, '--width', '1080', '--height', '720'
}
