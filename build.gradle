plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

evaluationDependsOn(':api')
evaluationDependsOn(':core')

// One jar per Minecraft version: -Pephemera.minecraft=<ver> picks an entry from
// gradle/minecraft-versions.json. src/ is shared; versions/<ver>/src/<set>/{java,resources}
// overlays hold the version-specific copies of mixins/glue that diverge. The default version
// (gradle.properties) keeps build/ so bench tooling and the release workflow are unchanged.
def supportedVersions = new groovy.json.JsonSlurper().parse(file('gradle/minecraft-versions.json'))
def defaultMinecraft = project.minecraft_version
def selectedMinecraft = providers.gradleProperty('ephemera.minecraft').getOrElse(defaultMinecraft)
def selectedVersion = supportedVersions[selectedMinecraft]
if (selectedVersion == null) {
	throw new GradleException("Unsupported Minecraft ${selectedMinecraft}; choose one of ${supportedVersions.keySet()}")
}
ext.minecraft_version = selectedMinecraft
ext.fabric_api_version = selectedVersion.fabricApi
if (selectedMinecraft != defaultMinecraft) {
	layout.buildDirectory = file("build/minecraft-${selectedMinecraft}")
}
def versionOverlay = file("versions/${selectedMinecraft}/src")

version = project.mod_version
group = project.maven_group

base {
	archivesName = "ephemera"
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

loom {
	splitEnvironmentSourceSets()
	['main', 'client'].each { name ->
		def set = sourceSets.getByName(name)
		set.java.srcDir(new File(versionOverlay, "${name}/java"))
		set.resources.srcDir(new File(versionOverlay, "${name}/resources"))
	}
	// Per version: the widened targets differ (26.3 dropped SurfaceRules$SurfaceRule).
	accessWidenerPath = new File(versionOverlay, 'main/resources/ephemera.accesswidener')
	enableTransitiveAccessWideners = true

	runConfigs.configureEach {
		runDir project.findProperty('ephemera.runDir') ?: 'run'
		property 'fabric.skipDependencyCheck', 'true'
		vmArg '-Dfabric.skipDependencyCheck=true'
		property 'fabric.modVersion.minecraft', project.minecraft_version
		vmArg "-Dfabric.modVersion.minecraft=${project.minecraft_version}"
	}

	mods {
		'ephemera' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':api')
	implementation project(':core')

	testImplementation sourceSets.client.output
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	def mcVersion = project.minecraft_version
	def worldVisuals = selectedVersion.worldVisuals == true
	inputs.property 'version', version
	inputs.property 'minecraft_version', mcVersion
	inputs.property 'world_visual_ownership', worldVisuals
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching('fabric.mod.json') {
		expand 'version': version, 'minecraft_version': mcVersion, 'world_visual_ownership': worldVisuals
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	archiveClassifier = "mc${project.minecraft_version}"
	from(project(':api').sourceSets.main.output)
	from(project(':core').sourceSets.main.output)
}

// Every mixin class compiled for this version must be listed in exactly one mixin config
// shipped for this version, and every listed mixin must exist. Catches shared/overlay drift.
def verifyMixinConfigs = tasks.register('verifyMixinConfigs') {
	def sets = ['main', 'client'].collect { sourceSets.getByName(it) }
	inputs.files(sets.collect { it.java.sourceDirectories })
	inputs.files(sets.collect { it.resources.sourceDirectories })
	doLast {
		def slurper = new groovy.json.JsonSlurper()
		def sources = [] as Set
		sets.each { set ->
			set.java.srcDirs.findAll { it.isDirectory() }.each { root ->
				def mixinRoot = new File(root, 'com/ephemera/mixin')
				if (!mixinRoot.isDirectory()) return
				mixinRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
					// Plugins live directly in com.ephemera.mixin; mixins live in its subpackages.
					if (f.name.endsWith('.java') && f.parentFile != mixinRoot) {
						sources << root.toPath().relativize(f.toPath()).toString().replace(File.separator, '.') - ~/\.java$/
					}
				}
			}
		}
		def listed = [:]
		sets.each { set ->
			set.resources.srcDirs.findAll { it.isDirectory() }.each { root ->
				root.eachFileMatch(~/.*\.mixins\.json/) { cfgFile ->
					def cfg = slurper.parse(cfgFile)
					['mixins', 'client', 'server'].each { side ->
						(cfg[side] ?: []).each { name ->
							def fqn = "${cfg.package}.${name}".toString()
							if (listed.containsKey(fqn)) {
								throw new GradleException("Mixin ${fqn} is listed in both ${listed[fqn]} and ${cfgFile.name}")
							}
							listed[fqn] = cfgFile.name
						}
					}
				}
			}
		}
		def missing = listed.keySet() - sources
		def unlisted = sources - listed.keySet()
		if (missing || unlisted) {
			throw new GradleException("Mixin configs out of sync for Minecraft ${project.minecraft_version}:" +
				(missing ? "\n  listed without a source file: ${missing.sort()}" : '') +
				(unlisted ? "\n  source file not in any config: ${unlisted.sort()}" : ''))
		}
	}
}

tasks.named('check') {
	dependsOn ':api:check', ':core:check', verifyMixinConfigs
}
