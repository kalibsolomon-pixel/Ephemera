name: build
on: [pull_request, push]

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      supported: ${{ steps.list.outputs.supported }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: List supported Minecraft versions
        id: list
        run: |
          echo "supported=$(jq -c '[to_entries[] | select(.value.status == "supported") | .key]' gradle/minecraft-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.versions.outputs.supported) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check layering, run tests, and build JAR
        run: ./gradlew --no-daemon -Pephemera.minecraft=${{ matrix.minecraft }} check build --console=plain
      - name: Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: ephemera-mc${{ matrix.minecraft }}
          path: |
            build/libs/ephemera-*-mc*.jar
            build/minecraft-${{ matrix.minecraft }}/libs/ephemera-*-mc*.jar
