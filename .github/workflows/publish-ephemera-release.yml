name: Publish Ephemera Release

# Manual release publication producing immutable SHA-256 verified GitHub releases
# discoverable by Aurora Launcher (asset naming: ephemera-<version>-mc<mc>.jar).
# Builds and publishes every Minecraft version marked "supported" in gradle/minecraft-versions.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Ephemera version declared in gradle.properties (without v)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - beta
      make_latest:
        description: 'Mark as latest release'
        required: true
        default: true
        type: boolean
      source_ref:
        description: 'Exact commit SHA, branch, or tag to build'
        required: true
        type: string

concurrency:
  group: ephemera-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify and build candidates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      mc_versions: ${{ steps.inspect.outputs.mc_versions }}
    steps:
      - name: Require master branch workflow
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/master' ]]; then
            echo 'Run release publication from the default master branch.' >&2
            exit 1
          fi
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin resolved source SHA
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag or release ${tag} already exists." >&2
            exit 1
          fi
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build, verify tests, and collect supported JARs
        id: inspect
        shell: bash
        run: |
          chmod +x ./gradlew
          default_mc="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          mod_ver="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [[ "$mod_ver" != "${{ inputs.version }}" ]]; then
            echo "gradle.properties mod_version ($mod_ver) != input version (${{ inputs.version }})" >&2
            exit 1
          fi

          mkdir -p release-bundle
          : > release-bundle/SHA256SUMS.txt
          : > release-bundle/manifest.tsv
          versions_list=()

          while IFS= read -r mc; do
            [[ -z "$mc" ]] && continue
            echo "=== Building and verifying Ephemera ${mod_ver} for Minecraft ${mc} ==="
            ./gradlew --no-daemon -Pephemera.minecraft="${mc}" check build --console=plain
            if [[ "$mc" == "$default_mc" ]]; then
              jar="build/libs/ephemera-${mod_ver}-mc${mc}.jar"
            else
              jar="build/minecraft-${mc}/libs/ephemera-${mod_ver}-mc${mc}.jar"
            fi
            if [[ ! -f "$jar" ]]; then
              echo "Expected JAR missing: $jar" >&2
              exit 1
            fi
            name="$(basename "$jar")"
            sha="$(sha256sum "$jar" | awk '{print $1}')"
            size="$(stat -c%s "$jar")"
            cp "$jar" "release-bundle/${name}"
            printf '%s  %s\n' "$sha" "$name" >> release-bundle/SHA256SUMS.txt
            printf '%s\t%s\t%s\t%s\n' "$mc" "$name" "$size" "$sha" >> release-bundle/manifest.tsv
            versions_list+=("$mc")
          done < <(jq -r 'to_entries[] | select(.value.status == "supported") | .key' gradle/minecraft-versions.json)

          if [[ ${#versions_list[@]} -eq 0 ]]; then
            echo "No supported Minecraft versions found in gradle/minecraft-versions.json" >&2
            exit 1
          fi
          joined="$(IFS=', '; echo "${versions_list[*]}")"
          echo "mc_versions=$joined" >> "$GITHUB_OUTPUT"
      - name: Hand off verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ephemera-release-candidate
          path: release-bundle/
          if-no-files-found: error

  publish:
    name: Publish verified GitHub release
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: ephemera-release-candidate
          path: release-bundle
      - name: Verify handoff SHA-256 and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          (cd release-bundle && sha256sum -c SHA256SUMS.txt)
          tag="v${{ inputs.version }}"
          {
            echo "Ephemera ${{ inputs.version }} for Minecraft ${{ needs.validate.outputs.mc_versions }}."
            echo ""
            echo "Source commit: \`${{ needs.validate.outputs.source_sha }}\`"
            echo ""
            echo "| Minecraft | Runtime JAR | Size | SHA-256 |"
            echo "| --- | --- | ---: | --- |"
            while IFS=$'\t' read -r mc name size sha; do
              echo "| ${mc} | \`${name}\` | ${size} bytes | \`${sha}\` |"
            done < release-bundle/manifest.tsv
          } > release-notes.md

          flags=(--latest="${{ inputs.make_latest }}")
          if [[ "${{ inputs.channel }}" != "stable" ]]; then
            flags+=(--prerelease --latest=false)
          fi

          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --draft --target "${{ needs.validate.outputs.source_sha }}" \
            --title "Ephemera ${{ inputs.version }}" \
            --notes-file release-notes.md "${flags[@]}"

          while IFS=$'\t' read -r _mc name _size _sha; do
            gh release upload "$tag" "release-bundle/${name}" -R "$GITHUB_REPOSITORY"
          done < release-bundle/manifest.tsv

          gh release edit "$tag" --draft=false --latest="${{ inputs.make_latest }}" -R "$GITHUB_REPOSITORY"
